# Example registry. Repo paths are relative to this file; a repo with no remote is read as it is.
repos:
  example:
    path: .

modules:
  - {id: commit-messages, repo: example, file: modules/commit-messages.md, trigger: "Before writing a commit message or amending a commit"}
  - {id: pr-description, repo: example, file: modules/pr-description.md, trigger: "Writing or updating a PR description"}
  - {id: device-testing, repo: example, file: modules/device-testing.md, trigger: "Before any adb command or device install", profile: work}
