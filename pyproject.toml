[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-context-router"
version = "0.1.2"
description = "MCP server that loads AGENTS.md instructions on demand from git-backed modules"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.13.0",
    "pyyaml>=6.0",
]

[project.scripts]
agent-context-router = "agent_context_router.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_context_router"]
